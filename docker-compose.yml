version: '3.8'
services:
  web:
    build: .
    container_name: saelego_app
    ports:
      - "8080:80"
    volumes:
      - ./PHP:/var/www/html
      - ./C:/var/www/html/C_backend
      - ./sae_java_group:/var/www/html/java_backend
      - ./jeux:/var/www/html/public/jeux
    environment:
      - DB_HOST=db
      - DB_NAME=lego_db
      - DB_USER=user
      - DB_PASS=password
    depends_on:
      - db

  # НОВИЙ: Node.js backend (Socket.io)
  node_backend:
    image: node:18-alpine
    container_name: saelego_node
    working_dir: /app
    volumes:
      - ./jeux/jeu1/backend:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "3001:3001"

  # НОВИЙ: React frontend
  react_frontend:
    image: node:18-alpine
    container_name: saelego_react
    working_dir: /app
    volumes:
      - ./jeux/jeu1/frontend:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # потрібно для hot-reload у Docker
    depends_on:
      - node_backend

  db:
    image: mysql:8.0
    container_name: saelego_db
    restart: always
    environment:
      MYSQL_DATABASE: lego_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./SQL/dump_lego_app.sql:/docker-entrypoint-initdb.d/dump.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: